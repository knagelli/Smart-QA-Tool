<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Req2QA — Requirements to Test Coverage</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>Req2QA</h1>
    <p class="tagline">Requirements to Test Coverage</p>
    <p class="sub">Requirement validation, test scenario generation &amp; traceability &mdash; no Claude account needed.</p>
  </header>

  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}

  <form class="card form" action="/analyze" method="post" enctype="multipart/form-data">
    <label>Access code
      <input type="password" name="access_code" required placeholder="Provided by your account manager">
    </label>

    <label>Application under test
      <input type="text" name="application" required placeholder="e.g. Salesforce Sales Cloud, Humanforce, SuccessFactors">
    </label>

    <label>Requirements document
      <input type="file" name="requirements_file" required accept=".docx,.xlsx,.xlsm,.pdf,.txt,.csv">
      <span class="hint">.docx, .xlsx/.xlsm, .pdf, .txt or .csv</span>
    </label>

    <button type="submit">Run Validation &amp; Generate Test Scenarios</button>
  </form>

  <p class="footnote">Processing usually takes 20&ndash;60 seconds depending on document size.</p>
</div>
</body>
</html>
