services:
  - type: web
    name: smart-qa-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLIENT_ACCESS_CODES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /healthz
