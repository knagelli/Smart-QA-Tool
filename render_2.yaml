services:
  - type: web
    name: smart-qa-tool
    runtime: python
    # Live execution (Phase 2) launches a real headless Chromium browser
    # per test case - this does not fit reliably in Render's free 512MB
    # tier. Upgrading to "starter" is a real, ongoing cost - confirm this
    # is acceptable before deploying this change, it is not automatic.
    plan: starter
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLIENT_ACCESS_CODES
        sync: false
      - key: DOWNLOAD_SIGNING_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /healthz
